# Render Blueprint (optional). Render → New → Blueprint → pick this repo.
# Equivalent to creating the Web Service by hand with the values in README.md.
services:
  - type: web
    name: veyra-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALLOWED_ORIGINS
        value: https://veyra.rf.gd
      - key: WEB_THREADS
        value: "8"
