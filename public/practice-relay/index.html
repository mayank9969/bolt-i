:root { --v-ink:#151b18; --v-paper:#f9f4e6; --v-blue:#173fd1; --v-red:#c93e2c; --v-gold:#eda919; }
body {background-color:var(--v-paper)}
#home {padding-top: clamp(2.5rem,5vw,5.5rem)}
#home h1 {font-size:clamp(3.6rem,5.6vw,6.15rem);line-height:.94;letter-spacing:-.045em;max-width:12ch}
#home .mono-label, #your-hands .mono-label, #leave-open .mono-label {letter-spacing:.17em}
#home > div {align-items:start}
#home .btn-block {background:var(--v-blue);box-shadow:5px 5px 0 var(--v-ink);border:1px solid var(--v-ink)}
#home .btn-block:hover {background:var(--v-ink)}
.v-guardian {position:relative;padding:11px;background:#fbf5e6;border:1.5px solid var(--v-ink);box-shadow:9px 9px 0 var(--v-blue)}
.v-guardian-frame {overflow:hidden;background:#0a2477;aspect-ratio: 1/1.05;}
.v-guardian img {width:100%;height:100%;display:block;object-fit:cover;object-position:42% center;animation:sky-open 1.1s ease-out both}
.v-guardian-caption,.v-ending-caption {display:flex;justify-content:space-between;gap:1rem;padding:13px 3px 2px;font:700 9px/1.4 'Space Mono',monospace;letter-spacing:.08em;color:var(--v-ink)}
