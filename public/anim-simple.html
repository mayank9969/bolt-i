<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simple animation — The Question Continues</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f8f1df; font-family: Georgia, serif; padding: 24px; color: #1b1a19; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: #555; font-size: 14px; }
  .frame { max-width: 900px; margin: 0 auto; border: 1px solid #111; background: #f8f1df; padding: 10px; box-shadow: 10px 10px 0 #c8382c; }
  .stage { position: relative; width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: #d9d0bf; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 5s loop, pure CSS — no JavaScript needed for the pictures */
  .img-scene { animation: sceneMove 5s linear infinite; }
  .img-man { object-fit: contain; animation: manMove 5s linear infinite; }
  .img-crowd { animation: crowdMove 5s linear infinite; }
  .img-orange { object-fit: contain; animation: orangeMove 5s linear infinite; }
  @keyframes sceneMove {
    0% { opacity: 1; transform: scale(1); }
    53% { opacity: 1; transform: scale(1.12); }
    55% { opacity: 0; transform: scale(1.15); }
    100% { opacity: 0; transform: scale(1.15); }
  }
  @keyframes manMove {
    0% { opacity: 0; transform: translateX(-8%) scale(1); }
    12% { opacity: 1; }
    36% { opacity: 1; transform: translateX(0) scale(0.94); }
    55% { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes crowdMove {
    0%, 36% { opacity: 0; transform: scale(1.08); }
    53% { opacity: 1; transform: scale(1); }
    64% { opacity: 1; }
    80% { opacity: 0.45; transform: scale(0.98); }
    100% { opacity: 0; }
  }
  @keyframes orangeMove {
    0%, 65% { opacity: 0; transform: translateX(12%) scale(0.92); }
    74% { opacity: 1; transform: translateX(0) scale(1); }
    88% { opacity: 1; transform: translateX(-14%) scale(1); }
    100% { opacity: 0; transform: translateX(-14%) scale(1); }
  }
  .cap { font-family: ui-monospace, monospace; text-transform: uppercase; letter-spacing: 0.2em; font-size: 12px; font-weight: 700; padding: 12px 6px 4px; display: flex; justify-content: space-between; gap: 12px; }
  .bar { height: 3px; background: #c8382c; width: 0; animation: barMove 5s linear infinite; }
  @keyframes barMove { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>
<h1>Simple animation — The Question Continues</h1>
<p class="sub">Four stills, pure CSS 5-second loop. No JavaScript. Refresh to replay.</p>
<div class="frame">
  <div class="stage">
    <img class="img-scene" src="/practice-relay/anim/scene.jpg" alt="Notebook scene" />
    <img class="img-man" src="/practice-relay/anim/man.jpg" alt="Man in blue coat" />
    <img class="img-crowd" src="/practice-relay/anim/crowd.jpg" alt="Crowd" />
    <img class="img-orange" src="/practice-relay/anim/orange.jpg" alt="Orange figure" />
  </div>
  <div class="bar"></div>
  <div class="cap"><span>The question begins → Everyone is walking the same way → Someone just stepped out → The question continues</span><span>5.0s loop</span></div>
</div>
</body>
</html>
