<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="VEYRA — Test your knowledge. Build your mastery. A quiz platform where every subject is an island, scored by a real Python engine." />
    <script>
      try {
        var t = localStorage.getItem('veyra.theme');
        var map = { paper: 'paper', ink: 'ink', editorial: 'paper', obsidian: 'ink', oxblood: 'ink', acid: 'ink', mono: 'ink' };
        document.documentElement.setAttribute('data-theme', map[t] || 'paper');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'paper'); }
    </script>
    <title>VEYRA · The Knowledge Archipelago</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
