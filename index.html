<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2eee5" />
    <meta name="description" content="NEXUSQuiz — Test your knowledge. Build your mastery. A premium quiz platform for Maths and Python." />
    <script>
      try {
        var t = localStorage.getItem('nexusquiz.theme');
        var map = { paper: 'paper', ink: 'ink', editorial: 'paper', obsidian: 'ink', oxblood: 'ink', acid: 'ink', mono: 'ink' };
        document.documentElement.setAttribute('data-theme', map[t] || 'paper');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'paper'); }
    </script>
    <title>NEXUSQuiz · Living Knowledge Network</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
